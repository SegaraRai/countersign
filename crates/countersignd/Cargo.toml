[package]
name = "countersignd"
description = "The countersign daemon: watches backends, applies decisions, and delivers notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["backend-octelium"]
backend-octelium = ["dep:countersign-backend-octelium"]

[dependencies]
async-trait.workspace = true
clap.workspace = true
countersign-backend-octelium = { workspace = true, optional = true }
countersign-core.workspace = true
countersign-store-sqlite.workspace = true
humantime-serde.workspace = true
jiff.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "time", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
