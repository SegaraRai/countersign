[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
countersign-auth-oidc = { path = "crates/countersign-auth-oidc" }
countersign-backend-exec = { path = "crates/countersign-backend-exec" }
countersign-backend-octelium = { path = "crates/countersign-backend-octelium" }
countersign-channel-discord = { path = "crates/countersign-channel-discord" }
countersign-channel-ntfy = { path = "crates/countersign-channel-ntfy" }
countersign-channel-webhook = { path = "crates/countersign-channel-webhook" }
countersign-core = { path = "crates/countersign-core" }
countersign-store-sqlite = { path = "crates/countersign-store-sqlite" }

askama = "0.16"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-private", "cookie-key-expansion"] }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
humantime-serde = "1"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
