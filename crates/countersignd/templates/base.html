<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% block title %}countersign{% endblock %}</title>
<style>
:root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fafafa; --muted: #6b6b70; --line: #d9d9de; --card: #fff;
        --ok: #1a7f37; --bad: #b42318; --warn: #9a6700; --accent: #2457d6; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #e8e8ea; --bg: #141416; --muted: #9b9ba3; --line: #2e2e33; --card: #1c1c1f;
          --ok: #4ac26b; --bad: #f47067; --warn: #d4a72c; --accent: #6d9bff; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
header { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
         padding: .75rem 1rem; border-bottom: 1px solid var(--line); background: var(--card); }
header a.brand { font-weight: 600; color: inherit; text-decoration: none; }
main { max-width: 960px; margin: 0 auto; padding: 1rem; }
a { color: var(--accent); }
table { width: 100%; border-collapse: collapse; background: var(--card); }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: .85rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin: 0 0 1rem; }
.card h1, .card h2 { margin-top: 0; }
.muted { color: var(--muted); }
.state { display: inline-block; padding: 0 .5rem; border-radius: 999px; font-size: .85rem; border: 1px solid currentColor; }
.state-pending { color: var(--warn); }
.state-active, .state-approved { color: var(--ok); }
.state-denied, .state-failed, .state-revoked { color: var(--bad); }
.state-expired, .state-withdrawn, .state-ended { color: var(--muted); }
.flash { padding: .6rem .8rem; border-radius: 6px; margin: 0 0 1rem; border: 1px solid; }
.flash-error { color: var(--bad); }
.flash-info { color: var(--accent); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
form.inline { display: inline; }
button { font: inherit; padding: .45rem .9rem; border-radius: 6px; border: 1px solid var(--line);
         background: var(--card); color: inherit; cursor: pointer; }
button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
button.deny { background: var(--bad); border-color: var(--bad); color: #fff; }
input[type=text] { font: inherit; padding: .4rem .6rem; border: 1px solid var(--line); border-radius: 6px;
                   background: var(--bg); color: inherit; width: 100%; max-width: 28rem; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .75rem; }
.table-wrap { overflow-x: auto; }
code { font-size: .9em; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">countersign</a>
  {% if let Some(user) = user %}
  <span class="muted"><a href="/link">Link chat account</a> · {{ user.name }}
    <form class="inline" method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ user.csrf }}">
      <button type="submit">Log out</button>
    </form>
  </span>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
