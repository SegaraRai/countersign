# /etc/countersign/sudo.toml (root:root 0644)
#
# Recommended setup — run once as root on the target host:
#   sudo countersign-sudo enroll \
#     --server https://countersign.example.com:2743 \
#     --server-key ed25519:<public-key-from-countersignd>
#
# `enroll` creates /etc/countersign/host.key (0600), pins countersign's signing
# key, writes this file, and prints the [[client]] block to add to config.toml.

# countersign's intake API URL. Always HTTPS (http:// only for localhost dev).
server = "https://countersign.example.com:2743"

# Extra PEM CA certificate(s) to trust in addition to the system root store
# (for private CAs or self-signed certificates).
# ca_file = "/etc/countersign/ca.pem"

# Pinned Ed25519 approval signing public key(s) from countersign.
# Obtain out of band from `countersign signing-key --public <file>` or the
# countersignd startup log. List both keys temporarily when rotating.
server_keys = ["ed25519:..."]

# This host's static key file (root:root 0600, `cshk_…`).
# Generated on this host by `countersign-sudo enroll` or `countersign host-key`
# so the secret never leaves the machine.
key_file = "/etc/countersign/host.key"

# Maximum time to wait for a human decision before withdrawing the request.
# Keep at or below the matching policy's `pending_timeout`.
timeout = "5m"

# Binaries accepted as the calling `sudo` process (anything else is refused).
# Defaults cover classic sudo, sudoedit, and sudo-rs on Debian/Ubuntu:
# sudo_binaries = [
#   "/usr/bin/sudo",
#   "/usr/bin/sudoedit",
#   "/usr/bin/sudo-rs",
#   "/usr/lib/cargo/bin/sudo",
#   "/usr/lib/cargo/bin/sudoedit",
# ]
