[package]
name = "countersign"
description = "Administration CLI for countersign: inspect requests, deny or revoke, manage account links, generate keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "countersign"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap.workspace = true
countersign-core.workspace = true
countersign-store-sqlite.workspace = true
countersignd = { path = "../countersignd" }
jiff.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
async-trait.workspace = true

[lints]
workspace = true
