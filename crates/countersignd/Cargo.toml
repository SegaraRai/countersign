[package]
name = "countersignd"
description = "The countersign daemon: watches backends, applies decisions, and delivers notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = [
  "backend-octelium",
  "backend-exec",
  "auth-oidc",
  "channel-discord",
  "channel-ntfy",
  "channel-slack",
  "channel-webhook",
  "channel-webpush",
]
backend-octelium = ["dep:countersign-backend-octelium"]
backend-exec = ["dep:countersign-backend-exec"]
auth-oidc = ["dep:countersign-auth-oidc"]
channel-discord = ["dep:countersign-channel-discord"]
channel-ntfy = ["dep:countersign-channel-ntfy"]
channel-slack = ["dep:countersign-channel-slack"]
channel-webhook = ["dep:countersign-channel-webhook"]
channel-webpush = ["dep:countersign-channel-webpush"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
axum-extra.workspace = true
clap.workspace = true
countersign-auth-oidc = { workspace = true, optional = true }
countersign-backend-exec = { workspace = true, optional = true }
countersign-backend-octelium = { workspace = true, optional = true }
countersign-channel-discord = { workspace = true, optional = true }
countersign-channel-ntfy = { workspace = true, optional = true }
countersign-channel-slack = { workspace = true, optional = true }
countersign-channel-webhook = { workspace = true, optional = true }
countersign-channel-webpush = { workspace = true, optional = true }
countersign-core.workspace = true
countersign-store-sqlite.workspace = true
fetchlet.workspace = true
fetchlet-http.workspace = true
humantime-serde.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "time", "sync", "net"] }
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
