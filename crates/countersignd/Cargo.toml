[package]
name = "countersignd"
description = "The countersign daemon: watches backends, applies decisions, and delivers notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["backend-octelium", "auth-oidc", "channel-discord"]
backend-octelium = ["dep:countersign-backend-octelium"]
auth-oidc = ["dep:countersign-auth-oidc"]
channel-discord = ["dep:countersign-channel-discord"]

[dependencies]
askama.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-extra.workspace = true
clap.workspace = true
countersign-auth-oidc = { workspace = true, optional = true }
countersign-backend-octelium = { workspace = true, optional = true }
countersign-channel-discord = { workspace = true, optional = true }
countersign-core.workspace = true
countersign-store-sqlite.workspace = true
humantime-serde.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "time", "sync", "net"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
