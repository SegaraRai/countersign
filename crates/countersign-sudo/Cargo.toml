[package]
name = "countersign-sudo"
description = "PAM helper for target hosts: asks countersign to approve a sudo invocation and waits for the answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "countersign-sudo"
path = "src/main.rs"

[dependencies]
countersign-core.workspace = true
humantime-serde.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "signal"] }
toml.workspace = true

[dev-dependencies]
axum.workspace = true
countersign-store-sqlite.workspace = true
countersignd = { path = "../countersignd" }
jiff.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
