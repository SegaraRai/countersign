name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Build embedded web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/build-web
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-build
          path: web/build
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-build
          path: web/build
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ matrix.target }}-
      - name: Build release binaries
        run: >
          cargo build --release --locked
          -p countersignd
          -p countersign
          -p countersign-sudo
          -p countersign-ask
      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          PKG="countersign-${TAG}-${TARGET}"
          mkdir -p "dist/${PKG}"
          cp target/release/countersignd "dist/${PKG}/"
          cp target/release/countersign "dist/${PKG}/"
          cp target/release/countersign-sudo "dist/${PKG}/"
          cp target/release/countersign-ask "dist/${PKG}/"
          cp crates/countersignd/config.example.toml "dist/${PKG}/"
          cp deploy/systemd/countersignd.service "dist/${PKG}/"
          cp LICENSE-APACHE LICENSE-MIT README.md "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
