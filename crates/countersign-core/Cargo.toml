[package]
name = "countersign-core"
description = "Domain core of countersign: requests, decisions, policy, and the plug-in traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
humantime-serde.workspace = true
sha2.workspace = true
jiff.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
uuid.workspace = true

# Browser-like WebAssembly hosts (e.g. Cloudflare Workers) have no OS clock or
# randomness; take them from JavaScript there.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
jiff = { workspace = true, features = ["js"] }

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
