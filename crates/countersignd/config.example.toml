# countersignd configuration. Validate with: countersignd --config <file> check
# Secrets never go in this file; components read them from *_file paths or
# environment variables. SIGHUP reloads [[approver]] and [[policy]].

# Extra files with [[approver]] / [[policy]] tables, relative to this file.
include = ["policies.d/*.toml"]

[server]
# Base URL of the web UI, used in links sent to channels and for the login
# callback (<public_url>/auth/callback).
public_url = "https://countersign.example.ts.net"
# Keep the listener private (loopback behind a proxy, or a tailnet address).
listen = "127.0.0.1:8080"
# 32+ random bytes, e.g. `head -c 64 /dev/urandom > session.key`. Without it,
# web sessions end whenever the daemon restarts.
session_key_file = "/etc/countersign/session.key"
session_ttl = "12h"
# A decision is `fresh-auth` while the IdP sign-in is at most this old.
fresh_auth_window = "5m"

[auth.oidc]
issuer = "https://id.example.com"
client_id = "00000000-0000-0000-0000-000000000000"
# Or set COUNTERSIGN_OIDC_CLIENT_SECRET.
client_secret_file = "/etc/countersign/oidc-client-secret"

[store]
path = "/var/lib/countersign/countersign.db"

[engine]
poll_interval = "5s"
# What to do with pending subjects no policy matches: "ignore" or "deny".
unmatched = "ignore"

[backend.oct-main]
type = "octelium"
domain = "octelium.example.com"
# octeliumctl = "/usr/local/bin/octeliumctl"
# homedir = "/var/lib/countersign/octelium"
# command_timeout = "30s"
# Map Octelium identity providers to approver identities (self-approval checks).
identity_providers = { pocket = "oidc:https://id.example.com" }

[channel.log]
type = "log"

# ntfy: push notifications with a button that opens the request in the web UI.
# With details = true, requester, target and reason are sent to the ntfy
# server; use a server you trust or set details = false.
# [channel.phone]
# type = "ntfy"
# server = "https://ntfy.example.com"
# topic = "countersign-ops"
# token_file = "/etc/countersign/ntfy-token"  # optional; or COUNTERSIGN_NTFY_TOKEN
# details = true
# priority = 4                                # for new requests (1-5)

# Discord: requests are posted with Approve/Deny buttons; presses arrive over
# the bot's Gateway connection (outbound only). The bot needs View Channel,
# Send Messages and Embed Links in the channel; no privileged intents.
# Approvers link their Discord account from the web UI ("Link chat account")
# and `/countersign-link`. Buttons approve directly only when the policy's
# min_assurance is "linked"; otherwise the approve button opens the web UI.
# [channel.discord]
# type = "discord"
# channel_id = "123456789012345678"
# guild_id = "234567890123456789"          # optional; decisions only from this server
# bot_token_file = "/etc/countersign/discord-token"  # or COUNTERSIGN_DISCORD_BOT_TOKEN
# mention_roles = ["345678901234567890"]  # optional; pinged on new requests

[[approver]]
id = "alice"
display_name = "Alice"
groups = ["approvers"]
# Same person in other systems; used to refuse self-approval.
identities = ["oidc:https://id.example.com#00000000-0000-0000-0000-000000000000"]

[[policy]]
name = "elevated-agents"
match = { backend = "oct-main", requester_group = "agents-elevated" }
approvers = ["group:approvers"]
max_ttl = "30m"
default_ttl = "15m"
pending_timeout = "10m"
min_assurance = "fresh-auth"
