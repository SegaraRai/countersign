name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI (check & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: vp i --frozen-lockfile
      - uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-${{ runner.os }}-${{ hashFiles('**/vite.config.*', '**/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            vp-task-${{ runner.os }}-
      - run: vp run check
      - run: vp run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-build
          path: web/build
          retention-days: 1

  rust:
    name: Rust (fmt, clippy, test, wasm)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-build
          path: web/build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p countersign-core --target wasm32-unknown-unknown
