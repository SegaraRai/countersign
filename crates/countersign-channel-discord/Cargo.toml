[package]
name = "countersign-channel-discord"
description = "Discord channel for countersign: posts requests with approve/deny buttons, receives presses over the Gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
countersign-core.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
twilight-gateway = { version = "0.18", default-features = false, features = ["rustls-webpki-roots", "zstd"] }
twilight-http = { version = "0.18", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = "0.18"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true

[lints]
workspace = true
