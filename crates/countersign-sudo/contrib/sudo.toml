# /etc/countersign/sudo.toml (root:root 0644)
#
# `countersign-sudo enroll --server URL [--ca-file PEM]` writes this file and
# the host key, after you confirm countersign's public key.

# countersign's intake API. Always HTTPS: the host key is the only thing
# that authenticates this host, so it must not cross the network in clear.
server = "https://countersign.example.com:8443"

# Extra PEM certificates to trust for `server` (a private CA or a
# self-signed certificate); the system's usual roots stay trusted.
# ca_file = "/etc/countersign/ca.pem"

# countersign's approval signing public key(s). An approval counts only with
# a valid signature by one of them over this host, this exact command and a
# fresh nonce. Get it out of band: `countersign signing-key --public <file>`
# on the countersign host, or the key countersignd logs at startup.
server_keys = ["ed25519:..."]

# This host's key (root:root 0600), in countersign's host key format
# (cshk_...; see docs/design/sudo-approval.md). Create it on this host, so
# the key never leaves it. Where the countersign CLI is installed:
#   countersign host-key /etc/countersign/host.key
# Otherwise, with openssl and coreutils (basenc):
#   b64() { basenc --base64url | tr -d '=\n'; }
#   body="cshk_$(openssl rand 32 | b64)"
#   sum=$(printf %s "$body" | openssl dgst -sha256 -binary | head -c 4 | b64)
#   (umask 077; printf '%s%s\n' "$body" "$sum" > /etc/countersign/host.key)
#   printf 'auth = { host_key = "sha256:%s" }\n' "$(printf %s "$body$sum" | sha256sum | cut -d' ' -f1)"
# Either way, put the printed auth line in this host's [[client]] entry in
# countersign's configuration (its id is the host name approvers see).
key_file = "/etc/countersign/host.key"

# Give up (and withdraw the request) after this long without a decision.
# Keep it at or below the policy's pending_timeout.
timeout = "5m"

# Programs accepted as the calling sudo (the helper refuses to run for
# anything else). The defaults cover sudo, sudoedit, and sudo-rs on Debian/Ubuntu.
# sudo_binaries = [
#   "/usr/bin/sudo",
#   "/usr/bin/sudoedit",
#   "/usr/bin/sudo-rs",
#   "/usr/lib/cargo/bin/sudo",
#   "/usr/lib/cargo/bin/sudoedit",
# ]
